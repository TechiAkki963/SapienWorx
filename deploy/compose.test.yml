name: sapienworx-test

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sapienworx
      POSTGRES_USER: sapienworx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sapienworx -d sapienworx"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: ../database
      dockerfile: Dockerfile.migrate
    environment:
      DATABASE_URL: postgres://sapienworx:${POSTGRES_PASSWORD}@postgres:5432/sapienworx?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data]
    restart: "no"

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-staging}
      API_PORT: "8080"
      DATABASE_URL: postgres://sapienworx:${POSTGRES_PASSWORD}@postgres:5432/sapienworx?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      AUTH_OTP_HMAC_SECRET: ${AUTH_OTP_HMAC_SECRET:?AUTH_OTP_HMAC_SECRET is required}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:8080}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_PRESIGN_TTL: ${S3_PRESIGN_TTL:-5m}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-6}
      DB_MIN_CONNS: ${DB_MIN_CONNS:-0}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [data, app]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
    restart: unless-stopped
    environment:
      NODE_ENV: production
      INTERNAL_API_URL: http://backend:8080
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    depends_on:
      backend:
        condition: service_healthy
    networks: [app]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 15
      start_period: 10s

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks: [app]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  app:
  data:
    internal: true

volumes:
  postgres_data:
