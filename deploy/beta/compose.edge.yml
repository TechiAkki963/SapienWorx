# One shared edge serves the unchanged public holding page and beta application.
name: sapienworx-holding
services:
  caddy:
    image: caddy:2.10.2-alpine
    container_name: sapienworx-caddy
    restart: unless-stopped
    environment:
      ACME_EMAIL: info@sapienworx.com
    ports: ["80:80", "443:443"]
    volumes:
      - ./edge:/etc/caddy:ro
      - /opt/sapienworx/holding/releases/775f239/public:/srv/holding:ro
      - /opt/sapienworx/runtime/caddy-data:/data
      - /opt/sapienworx/runtime/caddy-config:/config
    networks: [beta_proxy]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 128
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:2019/healthz]
      interval: 10s
      timeout: 3s
      retries: 6
networks:
  beta_proxy:
    external: true
    name: sapienworx_beta_proxy
