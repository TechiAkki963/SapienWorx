services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sapienworx
      POSTGRES_USER: sapienworx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sapienworx-local}
    ports:
      # Host port 5432 is commonly occupied by a developer's existing PostgreSQL.
      # Containers still connect internally on the standard port 5432.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sapienworx -d sapienworx"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: sapienworx
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-sapienworx-local}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/sapienworx
      DATABASE_USERNAME: sapienworx
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-sapienworx-local}
      REDIS_URL: redis://redis:6379
      RABBITMQ_ADDRESSES: rabbitmq:5672
      RABBITMQ_USERNAME: sapienworx
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-sapienworx-local}
      JWT_BASE64_SECRET: ${JWT_BASE64_SECRET:-c2FwaWVud29yeC1sb2NhbC1kZXZlbG9wbWVudC1qd3Qtc2VjcmV0LTMyaXRz}
      AUTH_COOKIE_SECURE: "false"
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    environment:
      SAPIENWORX_API_URL: http://api:8080
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    ports:
      # Keep the production container separate from an optional local `npm run dev` on 3000.
      - "3001:3000"
    depends_on:
      - api

volumes:
  postgres-data:
