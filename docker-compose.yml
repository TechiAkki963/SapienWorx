services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sapienworx
      POSTGRES_USER: sapienworx
      POSTGRES_PASSWORD: sapienworx_local
    ports:
      - "5432:5432"
    volumes:
      - sapienworx_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sapienworx -d sapienworx"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sapienworx_postgres_data:
