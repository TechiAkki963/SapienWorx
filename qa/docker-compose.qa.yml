services:
  postgres-qa:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sapienworx_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sapienworx_test"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio-qa:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "59000:9000"
      - "59001:9001"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio-qa:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "mc alias set qa http://minio-qa:9000 minioadmin minioadmin &&
      mc mb --ignore-existing qa/sapienworx-cv &&
      mc anonymous set none qa/sapienworx-cv"
