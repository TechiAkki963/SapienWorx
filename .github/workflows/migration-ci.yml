name: Database Migration CI

on:
  push:
    branches: [main]
    paths:
      - "database/migrations/**"
      - ".github/workflows/migration-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "database/migrations/**"
      - ".github/workflows/migration-ci.yml"

permissions:
  contents: read

concurrency:
  group: migrations-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  round-trip:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sapienworx_ci
          POSTGRES_USER: sapienworx
          POSTGRES_PASSWORD: sapienworx_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sapienworx -d sapienworx_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGPASSWORD: sapienworx_ci
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Verify migration pairs
        shell: bash
        run: |
          set -euo pipefail
          for up in database/migrations/*.up.sql; do
            down="${up%.up.sql}.down.sql"
            test -f "$down" || { echo "Missing down migration for $up"; exit 1; }
          done
      - name: Create restricted runtime roles
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U sapienworx -d sapienworx_ci <<'SQL'
          CREATE ROLE sapienworx_app NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION;
          CREATE ROLE sapienworx_intelligence NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION;
          SQL
      - name: Apply all forward migrations
        shell: bash
        run: |
          set -euo pipefail
          for migration in database/migrations/*.up.sql; do
            echo "Applying $migration"
            psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U sapienworx -d sapienworx_ci -f "$migration"
          done
      - name: Verify Intelligence least-privilege boundary
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U sapienworx -d sapienworx_ci <<'SQL'
          SET ROLE sapienworx_intelligence;
          SELECT count(*) FROM intelligence.source_candidate_features;
          SELECT count(*) FROM intelligence.source_job_features;
          SELECT * FROM intelligence.source_platform_snapshot;
          INSERT INTO intelligence.engine_heartbeats(engine_key,status,version,metadata)
          VALUES('ci-intelligence','healthy','ci','{}'::jsonb)
          ON CONFLICT(engine_key) DO UPDATE SET last_seen_at=now();
          RESET ROLE;
          SET ROLE sapienworx_app;
          SELECT count(*) FROM intelligence.model_versions;
          SELECT intelligence.enqueue_event('platform.analysis.requested','platform',NULL,'{}'::jsonb);
          RESET ROLE;
          SQL

          if psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U sapienworx -d sapienworx_ci -c "SET ROLE sapienworx_intelligence; SELECT count(*) FROM candidate_profiles;" >/dev/null 2>&1; then
            echo "Intelligence role unexpectedly read candidate_profiles directly." >&2
            exit 1
          fi
          if psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U sapienworx -d sapienworx_ci -c "SET ROLE sapienworx_intelligence; CREATE TABLE intelligence.should_not_exist(id integer);" >/dev/null 2>&1; then
            echo "Intelligence role unexpectedly created a database object." >&2
            exit 1
          fi
      - name: Verify Workforce Taxonomy foundation
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U sapienworx -d sapienworx_ci <<'SQL'
          DO $
          DECLARE resolved_name text;
          BEGIN
            SELECT e.canonical_name INTO resolved_name
            FROM workforce.resolve_term('ReactJS',ARRAY['competency']) r
            JOIN workforce.taxonomy_entities e ON e.id=r.entity_id;
            IF resolved_name IS DISTINCT FROM 'React' THEN
              RAISE EXCEPTION 'ReactJS alias resolved to %', resolved_name;
            END IF;

            SELECT e.canonical_name INTO resolved_name
            FROM workforce.resolve_term('ICU Nursing',ARRAY['competency']) r
            JOIN workforce.taxonomy_entities e ON e.id=r.entity_id;
            IF resolved_name IS DISTINCT FROM 'Critical Care Nursing' THEN
              RAISE EXCEPTION 'ICU Nursing alias resolved to %', resolved_name;
            END IF;
          END $;

          SELECT workforce.sync_source_terms(
            'ci_fixture',
            '11111111-1111-4111-8111-111111111111'::uuid,
            ARRAY['React.js','Novel Welding Process'],
            'competency',
            'ci'
          );

          DO $
          DECLARE mapped integer; provisional integer; trigger_count integer;
          BEGIN
            SELECT count(*) INTO mapped
            FROM workforce.term_mappings
            WHERE source_type='ci_fixture'
              AND source_id='11111111-1111-4111-8111-111111111111'::uuid
              AND entity_id IS NOT NULL;
            SELECT count(*) INTO provisional
            FROM workforce.term_mappings
            WHERE source_type='ci_fixture'
              AND source_id='11111111-1111-4111-8111-111111111111'::uuid
              AND provisional_term_id IS NOT NULL;
            SELECT count(*) INTO trigger_count
            FROM pg_trigger
            WHERE tgname IN ('trg_workforce_sync_job_required_skills','trg_workforce_sync_candidate_competencies')
              AND NOT tgisinternal;
            IF mapped <> 1 OR provisional <> 1 OR trigger_count <> 2 THEN
              RAISE EXCEPTION 'taxonomy foundation mismatch mapped=% provisional=% triggers=%', mapped, provisional, trigger_count;
            END IF;
          END $;

          SET ROLE sapienworx_intelligence;
          SELECT count(*) FROM workforce.taxonomy_entities;
          SELECT count(*) FROM workforce.taxonomy_aliases;
          RESET ROLE;
          SQL

          if psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U sapienworx -d sapienworx_ci -c "SET ROLE sapienworx_intelligence; UPDATE workforce.taxonomy_entities SET usage_count=usage_count+1;" >/dev/null 2>&1; then
            echo "Intelligence role unexpectedly mutated workforce taxonomy." >&2
            exit 1
          fi
      - name: Roll back all migrations
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r migration; do
            echo "Rolling back $migration"
            psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U sapienworx -d sapienworx_ci -f "$migration"
          done < <(printf '%s\n' database/migrations/*.down.sql | sort -r)
