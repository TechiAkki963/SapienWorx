name: UI UX responsive standardisation

on:
  push:
    branches:
      - ui-ux-responsive-standardisation
    paths:
      - "scripts/apply-ui-ux-responsive-standardisation.mjs"
      - ".github/workflows/ui-ux-responsive-standardisation.yml"
      - "app/**"
      - "components/**"
      - "AGENTS.md"

permissions:
  contents: write

concurrency:
  group: ui-ux-responsive-standardisation
  cancel-in-progress: true

jobs:
  standardise-and-verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_LOCAL_DEMO: "true"
    steps:
      - name: Check out standardisation branch
        uses: actions/checkout@v4
        with:
          ref: ui-ux-responsive-standardisation
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply design-system consolidation
        run: node scripts/apply-ui-ux-responsive-standardisation.mjs

      - name: Install locked dependencies
        run: npm ci

      - name: Run type and design-system guardrails
        run: npm run lint

      - name: Build production app
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run responsive browser regression
        run: npx playwright test --project=chromium --project=mobile-chromium

      - name: Commit verified standardisation
        run: |
          if git diff --quiet; then
            echo "No generated standardisation changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply verified UI UX responsive standardisation [skip ci]"
          git pull --rebase origin ui-ux-responsive-standardisation
          git push origin HEAD:ui-ux-responsive-standardisation
