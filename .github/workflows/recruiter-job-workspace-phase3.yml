name: Recruiter Job Workspace Phase 3 Validation

on:
  push:
    branches: [RecruiterJobWorkspace]
  pull_request:
    branches: [CandidateJobDiscovery, main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recruiter-job-workspace-phase3-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache-dependency-path: backend/go.sum
      - name: Verify module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...

  migrations:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sapienworx_ci
          POSTGRES_USER: sapienworx
          POSTGRES_PASSWORD: sapienworx_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sapienworx -d sapienworx_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGPASSWORD: sapienworx_ci
    steps:
      - uses: actions/checkout@v5
      - name: Create restricted runtime roles
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U sapienworx -d sapienworx_ci <<'SQL'
          CREATE ROLE sapienworx_app NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION;
          CREATE ROLE sapienworx_intelligence NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION;
          SQL
      - name: Apply migrations
        run: |
          set -euo pipefail
          for migration in database/migrations/*.up.sql; do
            psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U sapienworx -d sapienworx_ci -f "$migration"
          done
      - name: Verify Phase 3.2 job governance schema
        run: |
          set -euo pipefail
          columns="$(psql -At -h 127.0.0.1 -U sapienworx -d sapienworx_ci -c "SELECT count(*) FROM information_schema.columns WHERE table_schema='public' AND table_name='jobs' AND column_name IN ('screening_questions','referral_enabled','visibility','internal_notes','assigned_recruiter_id')")"
          test "$columns" = "5"
          audit_table="$(psql -At -h 127.0.0.1 -U sapienworx -d sapienworx_ci -c "SELECT CASE WHEN to_regclass('public.job_change_audit') IS NULL THEN 0 ELSE 1 END")"
          test "$audit_table" = "1"
      - name: Verify Phase 3.3 analytics indexes
        run: |
          set -euo pipefail
          applied_index="$(psql -At -h 127.0.0.1 -U sapienworx -d sapienworx_ci -c "SELECT CASE WHEN to_regclass('public.ix_applications_job_applied') IS NULL THEN 0 ELSE 1 END")"
          test "$applied_index" = "1"
          stage_index="$(psql -At -h 127.0.0.1 -U sapienworx -d sapienworx_ci -c "SELECT CASE WHEN to_regclass('public.ix_application_stage_audit_application_stage_changed') IS NULL THEN 0 ELSE 1 END")"
          test "$stage_index" = "1"
      - name: Verify Phase 3.4 bulk job audit schema
        run: |
          set -euo pipefail
          bulk_column="$(psql -At -h 127.0.0.1 -U sapienworx -d sapienworx_ci -c "SELECT count(*) FROM information_schema.columns WHERE table_schema='public' AND table_name='job_change_audit' AND column_name='bulk_operation_id'")"
          test "$bulk_column" = "1"
          bulk_index="$(psql -At -h 127.0.0.1 -U sapienworx -d sapienworx_ci -c "SELECT CASE WHEN to_regclass('public.ix_job_change_audit_bulk_operation') IS NULL THEN 0 ELSE 1 END")"
          test "$bulk_index" = "1"
      - name: Phase 3.5 recruiter job tenant security audit
        working-directory: backend
        env:
          RECRUITER_JOB_SECURITY_TEST_DATABASE_URL: postgres://sapienworx:sapienworx_ci@127.0.0.1:5432/sapienworx_ci?sslmode=disable
        run: go test -race ./internal/recruiter -run TestRecruiterJobSecurityIsolatedDatabase -count=1
      - name: Phase 3.6 recruiter job scale and query-plan gate
        working-directory: backend
        env:
          RECRUITER_JOB_SCALE_TEST_DATABASE_URL: postgres://sapienworx:sapienworx_ci@127.0.0.1:5432/sapienworx_ci?sslmode=disable
        run: go test ./internal/recruiter -run TestRecruiterJobWorkspaceScaleIsolatedDatabase -count=1 -v
      - name: Roll back all migrations
        run: |
          set -euo pipefail
          while IFS= read -r migration; do
            psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U sapienworx -d sapienworx_ci -f "$migration"
          done < <(printf '%s\n' database/migrations/*.down.sql | sort -r)

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Playwright
        run: npm run test:e2e
      - name: Master Admin security journeys
        run: npx playwright test --config playwright.admin-access.config.ts
      - name: Upload recruiter job builder visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-job-builder-visuals
          path: frontend/visual-artifacts/phase3-job-builder
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload recruiter job analytics visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-job-analytics-visuals
          path: frontend/visual-artifacts/phase3-job-analytics
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload recruiter bulk job visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-bulk-job-visuals
          path: frontend/visual-artifacts/phase3-bulk-jobs
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Phase 3.7 recruiter workflow visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-full-workflow-visuals
          path: frontend/visual-artifacts/phase3-full-workflow
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload stacked integration visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stack-integration-visuals
          path: frontend/visual-artifacts/stack-integration
          if-no-files-found: ignore
          retention-days: 7
