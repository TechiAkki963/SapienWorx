name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      - "scripts/verify-ai-boundary.py"
      - "deploy/beta/prepare-ai-secret.py"
      - "deploy/beta/test_ai_secret.py"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      - "scripts/verify-ai-boundary.py"
      - "deploy/beta/prepare-ai-secret.py"
      - "deploy/beta/test_ai_secret.py"

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      AI_ENABLED: "false"
      OPENAI_API_KEY: ""
      AI_GATEWAY_TEST_DATABASE_URL: postgres://postgres:ci-isolated-ai-only@127.0.0.1:5432/sapienworx_ai_gateway_test?sslmode=disable
    services:
      ai-governance-postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-isolated-ai-only
          POSTGRES_DB: sapienworx_ai_gateway_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d sapienworx_ai_gateway_test"
          --health-interval=5s --health-timeout=3s --health-retries=12
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.10"
          cache-dependency-path: backend/go.sum
      - name: Verify module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following Go files are not gofmt-formatted:"
            echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Verify server-only AI boundary (no billable calls)
        run: |
          python3 ../scripts/verify-ai-boundary.py
          python3 -m unittest discover -s ../deploy/beta -p test_ai_secret.py
      - name: Known vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: Test
        run: go test -race ./...
      - name: High-contention concurrency guards
        run: go test -race ./internal/platform/httpserver -run 'Test(IPRateLimiterConcurrentContention|CandidateActivityGate)' -count=10
      - name: Faceted job search benchmark smoke
        run: go test ./internal/platform/httpserver -run '^$' -bench '^BenchmarkCandidateJobsEndpoint$' -benchtime=100x -benchmem
