name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache-dependency-path: backend/go.sum
      - name: Verify module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following Go files are not gofmt-formatted:"
            echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Known vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: Test
        run: go test -race ./...
      - name: Compare Go test coverage with main
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          go test -coverprofile=coverage.out ./...
          current="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/,"",$3);print $3}')"
          test -n "$current"
          git fetch --no-tags --depth=1 origin main
          git worktree add --detach "$RUNNER_TEMP/swx-coverage-base" FETCH_HEAD
          (
            cd "$RUNNER_TEMP/swx-coverage-base/backend"
            go test -coverprofile=coverage.out ./...
            baseline="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/,"",$3);print $3}')"
            test -n "$baseline"
            echo "Base coverage: $baseline%; PR coverage: $current%"
            awk -v base="$baseline" -v pr="$current" 'BEGIN {if (pr + 0.01 < base) exit 1}' || {
              echo "::error::Go test coverage decreased compared with main."
              exit 1
            }
          )

      - name: High-contention concurrency guards
        run: go test -race ./internal/platform/httpserver -run 'Test(IPRateLimiterConcurrentContention|CandidateActivityGate)' -count=10
      - name: Faceted job search benchmark smoke
        run: go test ./internal/platform/httpserver -run '^$' -bench '^BenchmarkCandidateJobsEndpoint$' -benchtime=100x -benchmem
