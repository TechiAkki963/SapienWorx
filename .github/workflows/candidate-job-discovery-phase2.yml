name: Candidate Job Discovery Phase 2 Validation

on:
  push:
    branches: [CandidateJobDiscovery]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-job-discovery-phase2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache-dependency-path: backend/go.sum
      - name: Verify module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...

  migrations:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sapienworx_ci
          POSTGRES_USER: sapienworx
          POSTGRES_PASSWORD: sapienworx_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sapienworx -d sapienworx_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGPASSWORD: sapienworx_ci
    steps:
      - uses: actions/checkout@v5
      - name: Create restricted runtime roles
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U sapienworx -d sapienworx_ci <<'SQL'
          CREATE ROLE sapienworx_app NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION;
          CREATE ROLE sapienworx_intelligence NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION;
          SQL
      - name: Apply migrations
        run: |
          set -euo pipefail
          for migration in database/migrations/*.up.sql; do
            psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U sapienworx -d sapienworx_ci -f "$migration"
          done
      - name: Verify discovery indexes and aliases
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U sapienworx -d sapienworx_ci <<'SQL'
          DO $$
          DECLARE resolved_name text; index_count integer;
          BEGIN
            SELECT e.canonical_name INTO resolved_name
            FROM workforce.resolve_term('ICU Nursing',ARRAY['competency']) r
            JOIN workforce.taxonomy_entities e ON e.id=r.entity_id;
            IF resolved_name IS DISTINCT FROM 'Critical Care Nursing' THEN
              RAISE EXCEPTION 'taxonomy alias resolution failed: %', resolved_name;
            END IF;

            DECLARE
              candidate_source uuid := gen_random_uuid();
              job_source uuid := gen_random_uuid();
              mapped_matches integer;
            BEGIN
              PERFORM workforce.sync_source_terms('candidate_skill',candidate_source,ARRAY['ReactJS'],'competency','phase2.validation');
              PERFORM workforce.sync_source_terms('job_required_skill',job_source,ARRAY['React'],'competency','phase2.validation');

              SELECT count(*) INTO mapped_matches
              FROM workforce.term_mappings candidate_mapping
              JOIN workforce.term_mappings job_mapping
                ON candidate_mapping.entity_id=job_mapping.entity_id
              WHERE candidate_mapping.source_type='candidate_skill'
                AND candidate_mapping.source_id=candidate_source
                AND job_mapping.source_type='job_required_skill'
                AND job_mapping.source_id=job_source;

              IF mapped_matches <> 1 THEN
                RAISE EXCEPTION 'taxonomy-aware recommendation alias join failed: %', mapped_matches;
              END IF;

              DELETE FROM workforce.term_mappings
              WHERE source_id IN (candidate_source,job_source);
            END;

            SELECT count(*) INTO index_count
            FROM pg_indexes
            WHERE indexname IN (
              'ix_jobs_active_discovery_facets',
              'ix_jobs_role_category_trgm',
              'ix_workforce_job_mapping_entity_source'
            );
            IF index_count <> 3 THEN
              RAISE EXCEPTION 'Phase 2 discovery indexes missing: %', index_count;
            END IF;
          END $$;
          SQL
      - name: Roll back all migrations
        run: |
          set -euo pipefail
          while IFS= read -r migration; do
            psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U sapienworx -d sapienworx_ci -f "$migration"
          done < <(printf '%s\n' database/migrations/*.down.sql | sort -r)

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build

  e2e:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Playwright
        run: npm run test:e2e
      - name: Master Admin security journeys
        run: npx playwright test --config playwright.admin-access.config.ts
