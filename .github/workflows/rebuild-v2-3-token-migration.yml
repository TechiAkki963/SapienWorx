name: Rebuild v2.3 token migration

on:
  push:
    branches:
      - rebuild-v2.3-ux-hardening
    paths:
      - "scripts/migrate-design-tokens.mjs"
      - ".github/workflows/rebuild-v2-3-token-migration.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: rebuild-v2.3-ux-hardening
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Migrate CSS to shared design tokens
        run: node scripts/migrate-design-tokens.mjs

      - name: Commit migrated CSS
        run: |
          if git diff --quiet; then
            echo "No CSS migration changes were required."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- '*.css'
            git commit -m "Rebuild v2.3: migrate CSS to design tokens [skip ci]"
            git pull --rebase origin rebuild-v2.3-ux-hardening
            git push origin HEAD:rebuild-v2.3-ux-hardening
          fi

      - name: Verify design-token guardrail
        id: token_guardrail
        continue-on-error: true
        run: node scripts/check-design-tokens.mjs > design-token-violations.txt 2>&1

      - name: Upload token guardrail report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-token-guardrail-report
          path: design-token-violations.txt

      - name: Fail when token guardrail reports violations
        if: steps.token_guardrail.outcome == 'failure'
        run: |
          cat design-token-violations.txt
          exit 1
