name: Rebuild v2.3 UX hardening

on:
  push:
    branches:
      - main
    paths:
      - "app/**/*.css"
      - "components/**/*.css"
      - "scripts/migrate-design-tokens.mjs"
      - "scripts/apply-v2-3-ux-hardening.mjs"
      - "package.json"
      - ".github/workflows/rebuild-v2-3-token-migration.yml"

permissions:
  contents: write

concurrency:
  group: rebuild-v2-3-ux-hardening-main
  cancel-in-progress: true

jobs:
  harden-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply source UX hardening
        run: node scripts/apply-v2-3-ux-hardening.mjs

      - name: Migrate CSS to shared design tokens
        run: node scripts/migrate-design-tokens.mjs

      - name: Install dependencies
        run: npm ci

      - name: Type and design-token lint
        run: npm run lint

      - name: Production build
        id: production_build
        continue-on-error: true
        run: npm run build > rebuild-v2-3-build.log 2>&1

      - name: Upload production build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rebuild-v2-3-build-log
          path: rebuild-v2-3-build.log

      - name: Commit verified generated changes
        if: steps.production_build.outcome == 'success'
        run: |
          if git diff --quiet -- app components; then
            echo "No generated UX hardening changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app components
          git commit -m "Normalize UX design tokens [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Fail when production build fails
        if: steps.production_build.outcome == 'failure'
        run: |
          cat rebuild-v2-3-build.log
          exit 1
