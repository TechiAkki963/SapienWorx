name: Rebuild v2.3 UX hardening

on:
  push:
    branches:
      - rebuild-v2.3-ux-hardening
    paths:
      - "scripts/migrate-design-tokens.mjs"
      - "scripts/apply-v2-3-ux-hardening.mjs"
      - ".github/workflows/rebuild-v2-3-token-migration.yml"

permissions:
  contents: write

concurrency:
  group: rebuild-v2-3-ux-hardening
  cancel-in-progress: true

jobs:
  harden-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: rebuild-v2.3-ux-hardening
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply source UX hardening
        run: node scripts/apply-v2-3-ux-hardening.mjs

      - name: Migrate CSS to shared design tokens
        run: node scripts/migrate-design-tokens.mjs

      - name: Install dependencies
        run: npm ci

      - name: Type and design-token lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit verified generated changes
        run: |
          if git diff --quiet; then
            echo "No generated UX hardening changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app components
          git commit -m "Rebuild v2.3: apply verified UX hardening [skip ci]"
          git pull --rebase origin rebuild-v2.3-ux-hardening
          git push origin HEAD:rebuild-v2.3-ux-hardening
