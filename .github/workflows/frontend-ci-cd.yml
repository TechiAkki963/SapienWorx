name: Frontend CI/CD
on:
  push:
    branches: [main, complete-v1]
    paths: ["app/**","components/**","hooks/**","lib/**","e2e/**","package.json","package-lock.json","next.config.mjs","Dockerfile",".dockerignore","tsconfig.json",".github/workflows/frontend-ci-cd.yml"]
  pull_request:
    branches: [main]
    paths: ["app/**","components/**","hooks/**","lib/**","e2e/**","package.json","package-lock.json","next.config.mjs","Dockerfile",".dockerignore","tsconfig.json",".github/workflows/frontend-ci-cd.yml"]
permissions:
  contents: read
concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    name: Type-check and build web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        name: Check out source
      - uses: actions/setup-node@v4
        name: Set up Node 20
        with: { node-version: "20", cache: npm, cache-dependency-path: package-lock.json }
      - run: npm ci
        name: Install locked dependencies
      - run: npm run lint
        name: Run type checks
      - run: npm run build
        name: Build production app
  browser-regression:
    name: Four-breakpoint browser regression
    runs-on: ubuntu-latest
    env: { NEXT_PUBLIC_LOCAL_DEMO: "true" }
    steps:
      - uses: actions/checkout@v4
        name: Check out source
      - uses: actions/setup-node@v4
        name: Set up Node 20
        with: { node-version: "20", cache: npm, cache-dependency-path: package-lock.json }
      - run: npm ci
        name: Install locked dependencies
      - run: npx playwright install --with-deps chromium
        name: Install Chromium
      - run: npx playwright test --project=chromium --project=mobile-chromium
        name: Run browser automation
      - if: always()
        uses: actions/upload-artifact@v4
        name: Preserve visual walkthrough
        with: { name: "sapienworx-visual-walkthrough-${{ github.run_id }}", path: "artifacts/walkthrough/", retention-days: 30, if-no-files-found: warn }
      - if: failure()
        uses: actions/upload-artifact@v4
        name: Preserve failed-test diagnostics
        with: { name: playwright-report, path: "playwright-report/\ntest-results/", retention-days: 14 }
  docker-validate:
    name: Validate web container build
    needs: [build-and-test,browser-regression]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        name: Check out source
      - uses: docker/setup-buildx-action@v3
        name: Set up Docker Buildx
      - run: docker buildx build --load --file ./Dockerfile --tag sapienworx-frontend:ci .
        name: Build web image
  docker-build-push:
    name: Build and publish web image
    needs: [docker-validate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
        name: Check out source
      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-frontend" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        name: Log in to GitHub Container Registry
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/setup-buildx-action@v3
        name: Set up Docker Buildx
      - uses: docker/build-push-action@v6
        name: Build and push image
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
