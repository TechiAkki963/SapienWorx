name: Security assurance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "31 2 * * 1"

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Review dependency changes when GitHub Dependency Graph is available
        continue-on-error: true
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
      - name: Dependency review availability note
        run: echo "Dependency review is advisory until Dependency Graph is enabled in repository security settings. Verified-secret scanning remains blocking."

  repository-secrets:
    name: Secret patterns
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan tracked history for common credential formats
        uses: trufflesecurity/trufflehog@v3.90.8
        with:
          extra_args: --only-verified
