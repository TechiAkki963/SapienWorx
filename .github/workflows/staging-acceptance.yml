name: Staging Acceptance CI

on:
  push:
    branches: [main]
    paths:
      - "deploy/**"
      - "backend/**"
      - "frontend/**"
      - "database/**"
      - "performance/load_test.js"
      - ".github/workflows/staging-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ephemeral-staging:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      STAGING_BASE_URL: http://localhost:8080
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Create isolated staging environment
        shell: bash
        run: |
          cat > /tmp/sapienworx-acceptance.env <<'EOF'
          APP_ENV=staging
          GATEWAY_PORT=8080
          PUBLIC_ORIGIN=http://localhost:8080
          POSTGRES_PASSWORD=acceptance-postgres-password-2026
          JWT_SECRET=acceptance-jwt-secret-012345678901234567890123456789
          AUTH_OTP_HMAC_SECRET=acceptance-otp-secret-abcdefghijklmnopqrstuvwxyz123456
          AUTH_COOKIE_SECURE=false
          AUTH_COOKIE_DOMAIN=
          HTTP_TRUSTED_PROXY_CIDRS=172.16.0.0/12
          AWS_REGION=ap-south-1
          S3_BUCKET=
          DB_MAX_CONNS=6
          DB_MIN_CONNS=0
          EOF

      - name: Build and start ephemeral staging
        run: |
          docker compose --env-file /tmp/sapienworx-acceptance.env -f deploy/compose.test.yml config --quiet
          docker compose --env-file /tmp/sapienworx-acceptance.env -f deploy/compose.test.yml up -d --build

      - name: Wait for staging readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 3 http://localhost:8080/health/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Ephemeral staging did not become ready." >&2
          exit 1

      - name: Load isolated acceptance dataset
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file /tmp/sapienworx-acceptance.env -f deploy/compose.test.yml exec -T postgres \
            psql -U sapienworx -d sapienworx -v ON_ERROR_STOP=1 < database/seed.dev.sql
          docker compose --env-file /tmp/sapienworx-acceptance.env -f deploy/compose.test.yml exec -T postgres \
            psql -U sapienworx -d sapienworx -Atc "SELECT count(*) FROM jobs WHERE status='active';" | grep -Eq '^[1-9][0-9]*$'

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install acceptance browser
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run deployed browser acceptance
        working-directory: frontend
        run: npx playwright test --config=playwright.acceptance.config.ts

      - name: Authenticate load-test candidate
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            -d '{"email":"candidate.demo@sapienworx.local","password":"SapienDemo#2026","role":"candidate"}' \
            "$STAGING_BASE_URL/api/v1/auth/login")"
          token="$(printf '%s' "$body" | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')"
          test -n "$token"
          echo "::add-mask::$token"
          echo "ACCEPTANCE_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Set up Grafana k6
        uses: grafana/setup-k6-action@v1

      - name: Run controlled 20-VU staging smoke
        env:
          BASE_URL: http://localhost:8080
          ACCESS_TOKEN: ${{ env.ACCEPTANCE_ACCESS_TOKEN }}
          START_VUS: "1"
          PEAK_VUS: "20"
          RAMP_1: "5s"
          RAMP_2: "5s"
          RAMP_3: "5s"
          HOLD: "20s"
          RAMP_DOWN: "5s"
          THINK_MIN_MS: "100"
          THINK_MAX_MS: "300"
        run: k6 run performance/load_test.js

      - name: Capture deployment status
        if: always()
        shell: bash
        run: |
          docker compose --env-file /tmp/sapienworx-acceptance.env -f deploy/compose.test.yml ps > staging-container-status.txt || true

      - name: Collect failure logs
        if: failure()
        shell: bash
        run: |
          docker compose --env-file /tmp/sapienworx-acceptance.env -f deploy/compose.test.yml logs --no-color --tail=400 > staging-failure.log || true

      - name: Upload acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-acceptance-${{ github.run_id }}
          path: |
            frontend/playwright-report/acceptance
            frontend/test-results
            performance/summary.json
            staging-container-status.txt
            staging-failure.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Tear down ephemeral staging
        if: always()
        run: docker compose --env-file /tmp/sapienworx-acceptance.env -f deploy/compose.test.yml down -v --remove-orphans
