name: E2E CI

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/e2e-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/e2e-ci.yml"

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Playwright E2E
        run: npm run test:e2e
      - name: Run isolated Master Admin journeys
        run: npx playwright test --config playwright.admin-access.config.ts
      - name: Upload role theme visual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: role-theme-visuals
          path: frontend/visual-artifacts/theme-modes/
          if-no-files-found: error
          retention-days: 7
      - name: Upload Phase 5 Candidate 360 visual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5-candidate-360-visuals
          path: frontend/visual-artifacts/phase5-candidate-360/
          if-no-files-found: error
          retention-days: 7
      - name: Upload Phase 5 Application Pipeline visual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5-application-pipeline-visuals
          path: frontend/visual-artifacts/phase5-application-pipeline/
          if-no-files-found: error
          retention-days: 7
      - name: Upload Phase 4 discovery visual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-discovery-visuals
          path: frontend/visual-artifacts/phase4-discovery/
          if-no-files-found: error
          retention-days: 7
      - name: Upload P2.5 messaging QA visual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2.5-messaging-qa-visuals
          path: frontend/visual-artifacts/p2.5-messaging-qa/
          if-no-files-found: error
          retention-days: 14
      - name: Upload P2.6 recruiter product area screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2.6-recruiter-product-area-visuals
          path: frontend/visual-artifacts/p2.6-recruiter-product-areas/
          if-no-files-found: error
          retention-days: 14
      - name: Upload P2.7 UI mockup contract review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2.7-ui-mockup-review
          path: frontend/visual-artifacts/p2.7-ui-mockup/
          if-no-files-found: error
          retention-days: 14
      - name: Upload P2.4 SES health visual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2.4-ses-health-visuals
          path: frontend/visual-artifacts/p2.4-ses-health/
          if-no-files-found: error
          retention-days: 7
      - name: Upload successful visual acceptance screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-admin-visual-acceptance
          path: output/
          if-no-files-found: error
          retention-days: 7
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
      - name: Upload E2E traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results/
          retention-days: 7
