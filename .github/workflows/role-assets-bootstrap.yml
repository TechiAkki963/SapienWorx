name: Role Assets Bootstrap

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/role-assets-bootstrap.yml"

permissions:
  contents: write

concurrency:
  group: role-assets-bootstrap-main
  cancel-in-progress: false

jobs:
  build-local-role-assets:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow

      - name: Download approved high-resolution source photography
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sapien-role-assets
          curl -L --fail --retry 4 --retry-all-errors             "https://images.unsplash.com/photo-1758691737605-69a0e78bd193?auto=format&fit=crop&fm=jpg&q=95&w=4096"             -o /tmp/sapien-role-assets/candidate.jpg
          curl -L --fail --retry 4 --retry-all-errors             "https://images.unsplash.com/photo-1758518730327-98070967caab?auto=format&fit=crop&fm=jpg&q=95&w=4096"             -o /tmp/sapien-role-assets/recruiter.jpg
          curl -L --fail --retry 4 --retry-all-errors             "https://images.unsplash.com/photo-1758518730380-04c8e0d57b68?auto=format&fit=crop&fm=jpg&q=95&w=4096"             -o /tmp/sapien-role-assets/workplace.jpg
          curl -L --fail --retry 4 --retry-all-errors             "https://images.unsplash.com/photo-1742119971773-57e0131095b0?auto=format&fit=crop&fm=jpg&q=95&w=4096"             -o /tmp/sapien-role-assets/employer.jpg

      - name: Build local 4K WebP role assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          source_dir = Path("/tmp/sapien-role-assets")
          output_dir = Path("frontend/public/images/people")
          output_dir.mkdir(parents=True, exist_ok=True)

          assignments = {
              "candidate.jpg": [
                  "auth-candidate.webp",
                  "sapien-hero-candidate.webp",
              ],
              "recruiter.jpg": [
                  "auth-recruiter.webp",
                  "recruiter-review.webp",
                  "sapien-recruiter.webp",
              ],
              "workplace.jpg": [
                  "recruiter-team.webp",
                  "recruiter-workspace.webp",
                  "sapien-talent.webp",
                  "sapien-workplace.webp",
              ],
              "employer.jpg": [
                  "sapien-employer.webp",
              ],
          }

          for source_name, targets in assignments.items():
              source_path = source_dir / source_name
              with Image.open(source_path) as source:
                  image = source.convert("RGB")
                  if image.width < 3840:
                      raise SystemExit(
                          f"{source_name} is only {image.width}px wide; expected at least 3840px"
                      )
                  target_width = 3840
                  target_height = round(image.height * target_width / image.width)
                  image = image.resize((target_width, target_height), Image.Resampling.LANCZOS)

                  for target_name in targets:
                      target_path = output_dir / target_name
                      image.save(target_path, "WEBP", quality=82, method=6)
                      if target_path.stat().st_size > 1_500_000:
                          raise SystemExit(f"{target_name} exceeds 1.5 MB")
                      with Image.open(target_path) as check:
                          if check.width != 3840 or check.height < 600:
                              raise SystemExit(
                                  f"{target_name} failed dimensions: {check.width}x{check.height}"
                              )
                      print(target_name, image.size, target_path.stat().st_size)
          PY

      - name: Switch Next.js to local role assets
        shell: bash
        run: |
          cat > frontend/next.config.ts <<'EOF'
          import type { NextConfig } from "next";

          const nextConfig: NextConfig = {
            reactStrictMode: true,
            poweredByHeader: false,
            images: {
              // Step 3 keeps role photography inside the app instead of relying on
              // external runtime rewrites. Assets are local 3840px WebP sources.
              unoptimized: true,
            },
            experimental: {
              optimizePackageImports: ["motion"],
            },
          };

          export default nextConfig;
          EOF

          cat > frontend/public/images/people/README.md <<'EOF'
          # SapienWorx role photography

          Step 3 moves public/auth role photography into the application so rendering
          does not depend on third-party image delivery at runtime.

          All role files in this directory are local WebP assets with a source width
          of 3840 pixels. The page-level filenames remain stable so existing layouts,
          responsive crops, alt text and authentication flows do not need rewrites.

          Source set used for this integration:

          - Candidate: Unsplash photo `1758691737605-69a0e78bd193`
          - Recruiter: Unsplash photo `1758518730327-98070967caab`
          - Workplace / talent: Unsplash photo `1758518730380-04c8e0d57b68`
          - Employer: Unsplash photo `1742119971773-57e0131095b0`

          Before replacing these images in a future brand-art pass, preserve the
          existing filenames or update every consuming page and the UI regression
          tests together.
          EOF

      - name: Verify generated role assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          expected = [
              "auth-candidate.webp",
              "auth-recruiter.webp",
              "recruiter-review.webp",
              "recruiter-team.webp",
              "recruiter-workspace.webp",
              "sapien-employer.webp",
              "sapien-hero-candidate.webp",
              "sapien-recruiter.webp",
              "sapien-talent.webp",
              "sapien-workplace.webp",
          ]

          root = Path("frontend/public/images/people")
          for filename in expected:
              path = root / filename
              if not path.exists():
                  raise SystemExit(f"missing generated role asset: {filename}")
              with Image.open(path) as image:
                  if image.format != "WEBP":
                      raise SystemExit(f"{filename} is not WebP")
                  if image.width != 3840:
                      raise SystemExit(f"{filename} width is {image.width}, expected 3840")
                  print(filename, image.size, path.stat().st_size)
          PY

      - name: Commit local 4K assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SapienWorx Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/public/images/people frontend/next.config.ts
          if git diff --cached --quiet; then
            echo "Role assets already match the requested state."
            exit 0
          fi
          git commit -m "Integrate local 4K role assets"
          git push origin HEAD:main
