name: Frontend Lockfile Bootstrap

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/frontend-lockfile-bootstrap.yml"

permissions:
  contents: write

concurrency:
  group: frontend-lockfile-bootstrap-main
  cancel-in-progress: false

jobs:
  refresh-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22.x"
      - name: Upgrade Playwright and refresh lockfile
        working-directory: frontend
        run: |
          npm pkg set devDependencies.@playwright/test=1.63.0
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit dependency refresh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SapienWorx Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency state already current."
            exit 0
          fi
          git commit -m "Upgrade Playwright to patched release"
          git push origin HEAD:main
