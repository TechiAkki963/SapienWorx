name: QA

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash qa/scripts/third-party-isolation.sh .

  qa-browser:
    runs-on: ubuntu-latest
    needs: security-boundary
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sapienworx
          POSTGRES_USER: sapienworx
          POSTGRES_PASSWORD: sapienworx_local
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sapienworx -d sapienworx"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      API_PORT: 8080
      DATABASE_URL: postgres://sapienworx:sapienworx_local@127.0.0.1:5432/sapienworx?sslmode=disable
      JWT_SECRET: ci-test-jwt-secret-at-least-32-bytes-long
      AUTH_OTP_HMAC_SECRET: ci-test-otp-secret-at-least-32-bytes-long
      SNS_SMS_ENABLED: 'false'
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8080
      FRONTEND_URL: http://127.0.0.1:3000
      API_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.x' }
      - name: Backend quality gate
        working-directory: backend
        run: |
          go vet ./...
          go test ./... -race -coverprofile=coverage.out -count=1
      - name: Frontend quality gate
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build
      - name: Install browser test dependencies
        working-directory: qa
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Start API
        working-directory: backend
        run: nohup go run ./cmd/api > /tmp/api.log 2>&1 &
      - name: Start web
        working-directory: frontend
        run: nohup npm run dev -- --hostname 127.0.0.1 > /tmp/web.log 2>&1 &
      - name: Wait for application
        run: |
          for i in {1..60}; do curl -fsS http://127.0.0.1:8080/api/v1/health && break || sleep 2; done
          for i in {1..60}; do curl -fsS http://127.0.0.1:3000/ >/dev/null && break || sleep 2; done
      - name: Smoke and WCAG
        working-directory: qa
        run: npx playwright test tests/playwright/smoke.spec.ts tests/playwright/accessibility.spec.ts --project=chromium-desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-playwright-report
          path: qa/playwright-report/
          retention-days: 14

  database-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.x' }
      - name: Integration tests
        working-directory: qa/tests/go
        run: |
          go mod download
          go test ./... -v -count=1
